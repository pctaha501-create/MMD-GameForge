name: Desktop foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/mmd-cloud-training-mct-01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate cloud Python syntax
        run: python -m py_compile cloud/runtime/validate.py cloud/runtime/train.py
      - name: Run cloud runtime tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist
      - name: Build desktop application
        if: runner.os != 'Windows'
        run: npm run build
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mmd-gameforge-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
